[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "qenrich"
version = "0.1.0"
description = "Fast enrichment CLI for non-model organisms (GO/KEGG/Pfam/InterPro), powered by decoupler."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [ { name = "qenrich contributors" } ]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "decoupler>=2.2",
  "pandas",
  "numpy",
  "scipy",
  "matplotlib",
]
urls.Homepage = "https://github.com/WWz33/qenrich"
scripts.qenrich = "qenrich._cli:main"

[dependency-groups]
test = [ "pytest" ]

[tool.hatch.build.targets.wheel]
packages = [ "src/qenrich" ]

[tool.pytest.ini_options]
testpaths = [ "tests" ]
